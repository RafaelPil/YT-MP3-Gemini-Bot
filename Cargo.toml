[package]
name = "telegram_mp3_ai"
version = "0.1.0"
edition = "2021"

[dependencies]
teloxide = { version = "0.12", features = ["macros"] }
tokio = { version = "1.0", features = ["full"] }
reqwest = "0.11"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.0"
pretty_env_logger = "0.5.0"
log = "0.4.27"
dotenv = "0.15"
md5 = "0.7"
